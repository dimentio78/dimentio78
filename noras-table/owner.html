<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Nora's Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a showcase page holding two live instances of one responsive app (laptop frame + phone frame).
   The app lays itself out from its own container width, so the same code renders as a sidebar dashboard or a tab-bar phone app. */
:root{
  --font-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --stage:#DDE2D6;
  --bg:#EEF0E9;
  --surface:#FCFCF9;
  --surface-2:#F3F5EF;
  --ink:#15221B;
  --ink-2:#4E5B54;
  --ink-3:#7B8680;
  --line:#E0E4DB;
  --line-2:#CBD2C6;
  --side-bg:#14281E;
  --feature-bg:#1C3829;
  --on-dark:#EEF3EE;
  --on-dark-2:#A9BAB0;
  --primary:#1C3829;
  --on-primary:#F4F8F4;
  --accent:#F0B83F;
  --on-accent:#2A2108;
  --series:#2F6B4E;
  --bar:#C9D6CC;
  --good:#23794B;  --good-bg:#DCF0E3;
  --warn:#8F5A00;  --warn-bg:#FAEBC8;
  --crit:#B83A25;  --crit-bg:#FADCD4;
  --info:#2A62A6;  --info-bg:#DDE9F7;
  --focus:#2A62A6;
  --glass:rgba(252,252,249,.88);
  --scrim:rgba(10,18,13,.46);
  --shadow:0 1px 2px rgba(21,34,27,.04),0 14px 30px -18px rgba(21,34,27,.24);
  --frame-shadow:0 2px 6px rgba(21,34,27,.08),0 40px 80px -30px rgba(21,34,27,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#080C0A;
    --bg:#0E1511;
    --surface:#161F19;
    --surface-2:#1B261F;
    --ink:#E8EFE9;
    --ink-2:#A3B1A8;
    --ink-3:#74847B;
    --line:#24312A;
    --line-2:#33443A;
    --side-bg:#0A100C;
    --feature-bg:#1D4331;
    --on-dark:#EEF3EE;
    --on-dark-2:#A9BAB0;
    --primary:#F0B83F;
    --on-primary:#2A2108;
    --accent:#F0B83F;
    --on-accent:#2A2108;
    --series:#6FCB9B;
    --bar:#2B4137;
    --good:#5CC68B;  --good-bg:#153725;
    --warn:#E5AB3D;  --warn-bg:#3A2C0C;
    --crit:#F2866F;  --crit-bg:#3F1F18;
    --info:#7BB2EE;  --info-bg:#162B46;
    --focus:#7BB2EE;
    --glass:rgba(22,31,25,.88);
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
    --frame-shadow:0 2px 6px rgba(0,0,0,.4),0 40px 80px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#080C0A;
  --bg:#0E1511;
  --surface:#161F19;
  --surface-2:#1B261F;
  --ink:#E8EFE9;
  --ink-2:#A3B1A8;
  --ink-3:#74847B;
  --line:#24312A;
  --line-2:#33443A;
  --side-bg:#0A100C;
  --feature-bg:#1D4331;
  --on-dark:#EEF3EE;
  --on-dark-2:#A9BAB0;
  --primary:#F0B83F;
  --on-primary:#2A2108;
  --accent:#F0B83F;
  --on-accent:#2A2108;
  --series:#6FCB9B;
  --bar:#2B4137;
  --good:#5CC68B;  --good-bg:#153725;
  --warn:#E5AB3D;  --warn-bg:#3A2C0C;
  --crit:#F2866F;  --crit-bg:#3F1F18;
  --info:#7BB2EE;  --info-bg:#162B46;
  --focus:#7BB2EE;
  --glass:rgba(22,31,25,.88);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
  --frame-shadow:0 2px 6px rgba(0,0,0,.4),0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--font-body);margin:0;padding-inline:16px;padding-block:32px 56px;-webkit-font-smoothing:antialiased}

/* ---------- showcase page ---------- */
.page{max-width:1700px;margin-inline:auto}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:28px}
.intro>div{min-width:0;max-width:62ch}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.intro h1{font:600 clamp(34px,4.4vw,52px)/1 var(--font-display);letter-spacing:-.03em;margin:0 0 14px}
.intro p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);gap:2px}
.seg button{font:600 13px var(--font-body);color:var(--ink-2);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stage-host{width:100%}
.stage{display:flex;justify-content:center;align-items:flex-start;gap:48px}
.stage.stack{flex-direction:column;align-items:center;gap:40px}
.fig{margin:0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.fig figcaption{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.slot{width:calc(var(--w)*var(--s)*1px);height:calc(var(--h)*var(--s)*1px)}
.dev{width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform:scale(var(--s));transform-origin:0 0}

.browser{width:100%;height:100%;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--frame-shadow);display:flex;flex-direction:column}
.chrome{flex:none;height:44px;display:flex;align-items:center;gap:16px;padding-inline:16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.url{flex:0 1 420px;margin-inline:auto;height:28px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.url svg{opacity:.7}
.chrome .sp{width:52px}
.appwrap{position:relative;flex:1;min-height:0}
.appwrap .app{position:absolute;inset:0}

.phone{width:100%;height:100%;border-radius:60px;padding:10px;background:#0A0E0C;box-shadow:var(--frame-shadow),inset 0 0 0 2px #2B332E;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg)}
.screen .app{position:absolute;inset:50px 0 0 0;--safe-b:20px}
.sbar{position:absolute;inset:0 0 auto 0;height:50px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px var(--font-body);color:var(--ink);background:var(--bg)}
.sbar .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:108px;height:31px;margin-left:-54px;border-radius:20px;background:#000;z-index:6}
.hind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:6}

@media (max-width:520px){
  body{padding:0}
  .intro,.fig-desktop,.fig figcaption{display:none}
  .fig-phone{position:fixed;inset:0;z-index:10;background:var(--bg)}
  .fig-phone .slot{width:100%!important;height:100%!important}
  .fig-phone .dev{width:100%!important;height:100%!important;transform:none!important}
  .phone{padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .sbar,.island,.hind{display:none}
  .screen .app{inset:0;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
}

/* ---------- the app ---------- */
.app{--safe-t:0px;--safe-b:0px;container-type:inline-size;container-name:app;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--font-body)}
.app *{box-sizing:border-box}
:where(.app) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.app h1,.app h2,.app h3,.app p{margin:0}
.app :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.app svg.ic{flex:none;display:block}
.app .num{font-variant-numeric:tabular-nums}

.shell{display:grid;height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"col" "tabs"}
.side{grid-area:side;display:none}
.col{grid-area:col;min-width:0;min-height:0;display:flex;flex-direction:column}
.tabbar{grid-area:tabs}

/* mobile header */
.mhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px}
.mh-brand{display:flex;align-items:center;gap:10px;font:600 17px var(--font-display);letter-spacing:-.01em}
.mh-right{display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo.sm{width:30px;height:30px;border-radius:10px}

.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:16px;padding:4px 16px 28px}
.view.enter{animation:vin .32s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header inside a view */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.vhead h1{font:600 30px/1.05 var(--font-display);letter-spacing:-.03em;text-wrap:balance}
.vsub{margin-top:8px;color:var(--ink-2);font-size:14.5px;line-height:1.45;max-width:56ch}
.vact{display:none;align-items:center;gap:10px;flex:none}

.icon-btn{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.ping{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--surface)}
.av{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:600 15px var(--font-display);flex:none}

.open-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.open-chip i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.open-chip.on i{background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 6px}
.ch h2{font:600 18px/1.2 var(--font-display);letter-spacing:-.015em}
.ch .hint{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-family:var(--font-body);font-weight:400;letter-spacing:0}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip .ic{opacity:.8}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
button.pill{padding-right:6px;transition:filter .15s}
button.pill:hover{filter:brightness(.95)}
button.pill .ic{opacity:.7}
.st-new{background:var(--info-bg);color:var(--info)}
.st-cooking{background:var(--warn-bg);color:var(--warn)}
.st-ready{background:var(--good-bg);color:var(--good)}
.st-done{background:var(--surface-2);color:var(--ink-3)}
.st-confirmed{background:var(--good-bg);color:var(--good)}
.st-deposit{background:var(--warn-bg);color:var(--warn)}
.st-inquiry{background:var(--info-bg);color:var(--info)}
.st-done.pill::before{display:none}
.st-done.pill{padding-left:8px}

.seg-s{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg-s button{white-space:nowrap;padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg-s button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s}
.fchip b{font-weight:600;font-size:12px;color:var(--ink-3)}
.fchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.fchip[aria-pressed="true"] b{color:inherit;opacity:.75}

/* KPIs */
.kpis{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;width:176px;scroll-snap-align:start;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.kpi-val{font:600 28px/1.05 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:2px}
.kpi-sub{font-size:12px;color:var(--ink-3);line-height:1.3}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 8px 2px 5px;white-space:nowrap}
.spark{flex:none;display:block}
.kpi .spark{width:64px;height:24px}

/* Today layout */
.today-grid{display:flex;flex-direction:column;gap:16px}
.today-grid>.cl,.today-grid>.cr{display:contents}
.kitchen{order:1}.feature{order:2}.chart-card{order:3}.top-card{order:4}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13.5px}

/* order rows */
.olist{display:flex;flex-direction:column;padding-bottom:6px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"time name pill" "items items items" "type type total";align-items:center;gap:6px 10px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.orow:hover{background:var(--surface-2)}
.o-time{grid-area:time;font-weight:700;font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.o-name{grid-area:name;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-main{display:contents}
.o-items{grid-area:items;color:var(--ink-2);font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.o-type{grid-area:type;justify-self:start}
.o-area{display:none}
.o-total{grid-area:total;font:600 16px var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.o-st{grid-area:pill;justify-self:end}
.orow.done .o-name,.orow.done .o-total{color:var(--ink-3)}
.nowline{display:flex;align-items:center;gap:10px;padding:6px 18px;color:var(--crit);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nowline::before,.nowline::after{content:"";height:1px;background:currentColor;opacity:.4;flex:1}
.nowline::before{flex:none;width:6px}
.empty{padding:36px 18px 40px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:600 17px var(--font-display);color:var(--ink);margin-bottom:4px}

/* feature card */
.feature{position:relative;overflow:hidden;background:var(--feature-bg);color:var(--on-dark);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;border:0;box-shadow:var(--shadow)}
.feature .deco{position:absolute;right:-70px;top:-70px;width:240px;height:240px;color:var(--on-dark);opacity:.07;pointer-events:none}
.feature .eyebrow{color:var(--accent);margin:0}
.feature h2{font:600 24px/1.1 var(--font-display);letter-spacing:-.025em;text-wrap:balance}
.fmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13.5px;color:var(--on-dark-2)}
.fmeta div{display:flex;align-items:center;gap:8px;min-width:0}
.fmeta div:last-child{grid-column:1/-1}
.fmeta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fprog{display:flex;flex-direction:column;gap:8px}
.fprog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--on-dark-2);font-weight:500}
.track{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.2,1)}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;line-height:1.3;border-top:1px solid rgba(255,255,255,.08)}
.todo button:first-child{border-top:0}
.cb{width:20px;height:20px;border-radius:7px;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none;color:var(--on-accent);transition:background .15s,border-color .15s}
.todo button.on .cb{background:var(--accent);border-color:var(--accent)}
.todo button.on span{color:var(--on-dark-2);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.feature .btn{margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14.5px;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.wide{width:100%}

/* chart */
.chart{display:grid;grid-template-columns:minmax(0,1fr);padding:14px 18px 6px}
.plot{position:relative;height:var(--ch,170px);margin-left:34px}
.gl{position:absolute;left:0;right:0;bottom:calc(var(--p)*1%);border-top:1px solid var(--line)}
.gl:first-child{border-top-color:var(--line-2)}
.gl span{position:absolute;left:-34px;top:-8px;width:28px;text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.bcol{position:relative;display:flex;align-items:flex-end;justify-content:center;outline-offset:-2px}
.bar{width:min(44px,62%);height:var(--h);background:var(--bar);border-radius:6px 6px 0 0;transition:background .15s}
.bcol:hover .bar,.bcol:focus-visible .bar{background:color-mix(in srgb,var(--series) 55%,var(--bar))}
.bcol.today .bar{background:var(--series)}

const STATUS_LABEL={new:'New',cooking:'Cooking',ready:'Ready',done:'Done'};
const NEXT={new:'cooking',cooking:'ready',ready:'done'};
const EV_LABEL={confirmed:'Confirmed',deposit:'Deposit due',inquiry:'New request'};

/* ================= store (shared by both screens) ================= */
const store={open:true,orders:ORDERS,dishes:DISHES,events:EVENTS,subs:[],
  change(fn){fn();this.subs.forEach(s=>s())}};

/* ================= helpers ================= */
const money=n=>'₪'+Math.round(n).toLocaleString('en-US');
const orderSub=o=>o.items.reduce((s,[id,q])=>s+D[id].price*q,0);
const orderFee=o=>o.type==='delivery'?DELIVERY_FEE:0;
const orderTotal=o=>orderSub(o)+orderFee(o);
const itemsText=o=>o.items.map(([id,q])=>(q>1?q+' × ':'')+D[id].short).join(', ');
const evTotal=e=>e.guests*e.pp;
const typeChip=o=>`<span class="chip">${ic(o.type==='delivery'?'truck':'pack',14)}${o.type==='delivery'?'Delivery<span class="cx"> · '+o.area+'</span>':'Pickup'}</span>`;
const nextLabel=o=>({new:'Start cooking',cooking:'Mark ready',ready:o.type==='delivery'?'Mark delivered':'Mark picked up'})[o.status];
function spark(vals){
  const w=92,h=30,p=3,mn=Math.min(...vals),mx=Math.max(...vals);
  const x=i=>p+i*(w-2*p)/(vals.length-1),y=v=>h-p-((v-mn)/((mx-mn)||1))*(h-2*p);
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const line='M'+pts.map(q=>f(q[0])+' '+f(q[1])).join(' L');
  const area=line+` L${f(x(vals.length-1))} ${h} L${f(x(0))} ${h}Z`;
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${area}" fill="var(--series)" opacity=".13"/><path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${f(l[0])}" cy="${f(l[1])}" r="3" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
const stats=()=>{
  const o=store.orders,rev=o.reduce((s,x)=>s+orderTotal(x),0);
  return {rev,n:o.length,cook:o.filter(x=>x.status==='new'||x.status==='cooking').length,ready:o.filter(x=>x.status==='ready').length,
    del:o.filter(x=>x.type==='delivery').length,avg:rev/o.length,newN:o.filter(x=>x.status==='new').length};
};
const booked=()=>store.events.filter(e=>e.status!=='inquiry');
const dishThumb=(d,cls='')=>`<div class="thumb ${cls}" style="--tint:${d.tint}">${art(d.art)}</div>`;

/* ================= view builders ================= */
function vhead(app,eyebrow,title,sub){
  return `<div class="vhead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p class="vsub">${sub}</p>`:''}</div>
  <div class="vact">${openChip()}<button class="icon-btn" data-action="bell" aria-label="Activity">${ic('bell',19)}<i class="ping"></i></button><div class="av">N</div></div></div>`;
}
const openChip=()=>`<button class="open-chip ${store.open?'on':''}" data-action="toggle-open" role="switch" aria-checked="${store.open}"><i></i><span>${store.open?'Kitchen open':'Orders paused'}</span></button>`;

function orderRow(o,withTime=true){
  const done=o.status==='done';
  const pill=done?`<span class="pill st-done o-st">${ic('check',14)}Done</span>`
    :`<button class="pill st-${o.status} o-st" data-action="advance" data-id="${o.id}" title="${nextLabel(o)}" aria-label="${STATUS_LABEL[o.status]}. Next: ${nextLabel(o)}">${STATUS_LABEL[o.status]}${ic('chev',14)}</button>`;
  return `<div class="orow ${done?'done':''}" data-action="open-order" data-id="${o.id}" role="button" tabindex="0">
    <div class="o-time">${o.time}</div>
    <div class="o-main"><div class="o-name">${o.name}<span class="o-area">${o.type==='delivery'?o.area:''}</span></div><div class="o-items">${itemsText(o)}</div></div>
    <div class="o-type">${typeChip(o)}</div>
    <div class="o-total num">${money(orderTotal(o))}</div>
    ${pill}
  </div>`;
}
function orderRows(list,withNow){
  if(!list.length)return `<div class="empty"><b>Nothing here</b>No orders match this filter.</div>`;
  let out='',placed=!withNow;
  list.forEach(o=>{
    if(!placed&&o.time>NOW){out+=`<div class="nowline">Now · ${NOW}</div>`;placed=true}
    out+=orderRow(o);
  });
  return out;
}

function kpi(label,delta,val,sub,vals){
  return `<div class="kpi card"><div class="kpi-top"><span class="lbl">${label}</span>${delta?`<span class="delta">${ic('up',12)}${delta}</span>`:''}</div>
  <div class="kpi-val">${val}</div><div class="kpi-bot"><span class="kpi-sub">${sub}</span>${spark(vals)}</div></div>`;
}

function prepList(e){
  return `<div class="todo">${e.prep.map((p,i)=>`<button data-action="prep" data-id="${e.id}" data-i="${i}" class="${p[1]?'on':''}" role="checkbox" aria-checked="${!!p[1]}"><span class="cb">${p[1]?ic('check',13):''}</span><span>${p[0]}</span></button>`).join('')}</div>`;
}
const prepProg=e=>{const d=e.prep.filter(p=>p[1]).length;return {d,n:e.prep.length,pct:e.prep.length?Math.round(d/e.prep.length*100):0}};

function featureCard(){
  const e=EV.e1,pg=prepProg(e),days=e.day-TODAY_DAY;
  return `<section class="feature">
    <svg class="deco" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="50" cy="50" r="48"/><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="24"/></svg>
    <div class="eyebrow">Next catering · in ${days} days</div>
    <h2>${e.title}</h2>
    <div class="fmeta">
      <div>${ic('calendar',16)}<span>${e.wd} ${e.day} Oct · ${e.time}</span></div>
      <div>${ic('users',16)}<span>${e.guests} guests</span></div>
      <div>${ic('pin',16)}<span>${e.area}</span></div>
      <div>${ic('utensils',16)}<span>${e.pkg} · ${money(e.pp)} pp</span></div>
    </div>
    <div class="fprog"><div class="fprog-top"><span>Prep checklist</span><span class="num">${pg.d} of ${pg.n} done</span></div><div class="track"><i style="width:${pg.pct}%"></i></div></div>
    ${prepList(e)}
    <button class="btn wide" data-action="open-event" data-id="e1">Open event ${ic('chev',16)}</button>
  </section>`;
}

function chartCard(rev){
  const days=WEEK.map(w=>({d:w[0],date:w[1],v:w[2]==null?rev:w[2],today:w[2]==null}));
  const total=days.reduce((s,x)=>s+x.v,0),max=5000;
  const peak=days.reduce((a,b)=>b.v>a.v?b:a);
  const share=Math.round(peak.v/total*100);
  const prev=16800,dl=Math.round((total-prev)/prev*100);
  const grid=[0,1000,2000,3000,4000,5000].map(v=>`<div class="gl" style="--p:${v/max*100}"><span>${v?v/1000+'k':'0'}</span></div>`).join('');
  const cols=days.map(x=>{
    const h=(x.v/max*100).toFixed(1)+'%';
    const showVal=x===peak||x.today;
    return `<div class="bcol ${x.today?'today':''}" style="--h:${h}" tabindex="0" aria-label="${x.d} ${x.date}: ${money(x.v)}"><div class="bar"></div>${showVal?`<div class="bval">${money(x.v)}</div>`:''}<div class="btip"><b>${money(x.v)}</b>${x.d} ${x.date}${x.today?' · so far':''}</div></div>`;
  }).join('');
  const xs=days.map(x=>`<div class="${x.today?'t':''}"><b>${x.d}</b>${x.date.split(' ')[0]}</div>`).join('');
  return `<section class="card chart-card"><div class="ch"><div><h2>Revenue, last 7 days</h2><div class="hint">Orders booked per day, in shekels</div></div>
    <div class="tot"><b>${money(total)}</b><span class="delta">${ic('up',12)}${dl}%</span></div></div>
    <div class="chart"><div class="plot">${grid}<div class="cols">${cols}</div></div><div class="xax">${xs}</div></div>
    <div class="insight">${ic('spark',18)}<span>${peak.d==='Fri'?'Fridays':'The '+peak.d}  bring ${share}% of the week. Pre-Shabbat orders close Thursday at 20:00, so Wednesday prep decides Friday.</span></div></section>`;
}

function topCard(){
  const max=TOP[0][1];
  return `<section class="card top-card"><div class="ch"><div><h2>Top dishes</h2><div class="hint">Portions sold this week</div></div></div>
    <div class="tlist">${TOP.map(([id,n])=>{const d=D[id];return `<div class="trow">${dishThumb(d)}<div style="min-width:0"><div class="nm">${d.short}</div><div class="bar2"><i style="width:${n/max*100}%"></i></div></div><div class="ct">${n}<small>portions</small></div></div>`}).join('')}</div></section>`;
}

function todayView(st){
  const s=stats();
  const list=store.orders.filter(o=>st.kf==='all'||o.status!=='done');
  const left=s.cook;
  const bk=booked(),bkSum=bk.reduce((a,e)=>a+evTotal(e),0),req=store.events.length-bk.length;
  return `${vhead(st,'Tuesday, 6 October','Good morning, Nora',`${s.n} orders today, ${left} still to cook. Next catering is in ${EV.e1.day-TODAY_DAY} days.`)}
  ${store.open?'':`<div class="banner">${ic('alert',18)}Orders are paused. Customers see a "back tomorrow" note.</div>`}
  <div class="kpis">
    ${kpi('Booked today','12%',money(s.rev),`${s.n} orders`,[2140,3480,4920,640,1980,2310,s.rev])}
    ${kpi('Orders','2',s.n,`${s.cook} to cook · ${s.ready} ready`,[8,11,16,3,7,9,s.n])}
    ${kpi('Catering in October','',money(bkSum),`${bk.length} booked · ${req} request`,[2,3,2,4,3,4,bk.length])}
    ${kpi('Average order','₪31',money(s.avg),`${s.del} delivery, ${s.n-s.del} pickup`,[190,201,214,196,230,218,s.avg])}
  </div>
  <div class="today-grid">
    <div class="cl">
      <section class="card kitchen"><div class="ch"><div><h2>Today's kitchen</h2><div class="hint">Tap a status to move an order forward</div></div>
        <div class="seg-s" role="group" aria-label="Filter"><button data-action="kf" data-id="active" aria-pressed="${st.kf==='active'}">To do</button><button data-action="kf" data-id="all" aria-pressed="${st.kf==='all'}">All</button></div></div>
        <div class="olist">${orderRows(list,st.kf==='all')}</div></section>
      ${chartCard(s.rev)}
    </div>
    <div class="cr">${featureCard()}${topCard()}</div>
  </div>`;
}

function ordersView(st){
  const cnt=k=>k==='all'?store.orders.length:store.orders.filter(o=>o.status===k).length;
  const chips=[['all','All'],['new','New'],['cooking','Cooking'],['ready','Ready'],['done','Done']];
  return `${vhead(st,'Tuesday, 6 October','Orders',`${store.orders.length} orders today, ${money(stats().rev)} booked.`)}
  <div class="filters" role="group" aria-label="Order status">${chips.map(([k,l])=>`<button class="fchip" data-action="of" data-id="${k}" aria-pressed="${st.of===k}">${l}<b class="num">${cnt(k)}</b></button>`).join('')}</div>
  <section class="card"><div class="olist" data-slot="orders">${ordersList(st)}</div></section>`;
}
function ordersList(st){
  const q=st.q.trim().toLowerCase();
  const list=store.orders.filter(o=>(st.of==='all'||o.status===st.of)&&(!q||(o.name+' '+o.area+' '+itemsText(o)).toLowerCase().includes(q)));
  return orderRows(list,st.of==='all'&&!q);
}

function menuView(st){
  const cats=['All','Starters','Mains','Bakes','Sweets'];
  const list=store.dishes.filter(d=>st.mc==='All'||d.cat===st.mc);
  const on=store.dishes.filter(d=>d.avail).length;
  return `${vhead(st,`${store.dishes.length} dishes`,'Menu',`Switch a dish off and it shows as sold out on the customer site straight away.`)}
  <div class="filters" role="group" aria-label="Category">${cats.map(c=>`<button class="fchip" data-action="mc" data-id="${c}" aria-pressed="${st.mc===c}">${c}</button>`).join('')}</div>
  <div class="msum"><b class="num">${on} of ${store.dishes.length}</b> available today</div>
  <div class="mgrid">${list.map(d=>`<article class="dcard ${d.avail?'':'off'}"><div class="dart" style="--tint:${d.tint}">${art(d.art)}<span class="dtag ${d.diet}"><i></i>${d.diet}</span>${d.avail?'':'<span class="soldout">Sold out</span>'}</div>
    <div class="dbody"><div class="dname">${d.name}</div><div class="dfoot"><span class="dprice num">${money(d.price)}</span><button class="sw" role="switch" aria-checked="${d.avail}" aria-label="${d.short} available" data-action="avail" data-id="${d.id}"></button></div></div></article>`).join('')}</div>`;
}

function eventsView(st){
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells=wd.map(w=>`<div>${w}</div>`).join('');
  const head=`<div class="cal-h">${cells}</div>`;
  let g='';
  for(let i=0;i<4;i++)g+='<div class="day blank"></div>';
  for(let d=1;d<=31;d++){
    const col=(4+d-1)%7,we=col>=5;
    const e=store.events.find(x=>x.day===d);
    g+=`<div class="day ${we?'we':''} ${d===TODAY_DAY?'today':''} ${e?'has':''}" ${e?`data-action="open-event" data-id="${e.id}" role="button" tabindex="0" aria-label="${e.title}, ${d} October"`:''}><span class="dn num">${d}</span>${e?`<span class="dot ${e.status}"></span><span class="evp ${e.status}"><b>${e.time}</b><span>${e.title}</span></span>`:''}</div>`;
  }
  const bk=booked(),sum=bk.reduce((a,e)=>a+evTotal(e),0);
  return `${vhead(st,'October 2026','Catering',`${bk.length} events booked for ${money(sum)}. ${store.events.length-bk.length} request waiting for your answer.`)}
  <div class="ev-layout">
    <section class="card"><div class="ch"><div><h2>October</h2><div class="hint">Fridays and Saturdays are shaded</div></div></div><div class="cal">${head}<div class="cal-g">${g}</div></div></section>
    <section class="card"><div class="ch"><div><h2>Upcoming</h2><div class="hint">Tap an event for the menu and payments</div></div></div>
      <div>${store.events.map(e=>`<div class="evcard" data-action="open-event" data-id="${e.id}" role="button" tabindex="0">
        <div class="edate"><small>${e.wd}</small><b>${e.day}</b></div>
        <div class="et">${e.title}</div>
        <div class="em"><span>${ic('users',14)}${e.guests} guests</span><span>${ic('pin',14)}${e.area}</span></div>
        <div class="ef"><span class="pill st-${e.status}">${EV_LABEL[e.status]}</span><b class="num">${money(evTotal(e))}</b></div></div>`).join('')}</div></section>
  </div>`;
}

/* ================= sheets ================= */
function sheetOrder(id){
  const o=store.orders.find(x=>x.id===id);
  const done=o.status==='done';
  return `<header class="sh-head"><div><h2>${o.name}</h2><div class="sh-sub"><span>${ic('clock',15)}${o.time}</span><span>${ic(o.type==='delivery'?'truck':'pack',15)}${o.type==='delivery'?'Delivery to '+o.area:'Pickup'}</span></div></div><button class="x" data-action="close" aria-label="Close">${ic('x',18)}</button></header>
  <div class="sh-body">
    <div><span class="pill st-${o.status}">${STATUS_LABEL[o.status]}</span></div>
    ${o.note?`<div class="note">${ic('alert',18)}<span>${o.note}</span></div>`:''}
    <div><div class="sh-h3">Items</div><div class="lines">${o.items.map(([i,q])=>`<div class="line">${dishThumb(D[i],'s40')}<div><div class="nm">${D[i].short}</div><div class="q">${q} × ${money(D[i].price)}</div></div><div class="pr">${money(D[i].price*q)}</div></div>`).join('')}</div></div>
    <div class="sum"><div><span>Subtotal</span><span>${money(orderSub(o))}</span></div><div><span>Delivery</span><span>${orderFee(o)?money(orderFee(o)):'Free'}</span></div><div class="t"><span>Total</span><span>${money(orderTotal(o))}</span></div></div>
  </div>
  <footer class="sh-foot">${done?`<div class="done-note">${ic('check',18)}Completed</div>`:`<button class="btn primary" data-action="advance" data-id="${o.id}">${nextLabel(o)}</button>`}</footer>`;
}
function sheetEvent(id){
  const e=EV[id],tot=evTotal(e),dep=tot/2,pg=prepProg(e);
  let foot;
  if(e.status==='inquiry')foot=`<button class="btn primary" data-action="ev-advance" data-id="${e.id}">Accept and send quote</button>`;
  else if(e.status==='deposit')foot=`<button class="btn primary" data-action="ev-advance" data-id="${e.id}">Mark deposit received</button>`;
  else foot=`<div class="done-note">${ic('check',18)}Booked and paid</div>`;
  const depRow=e.status==='inquiry'?'':`<div><span>Deposit, 50%</span><span>${money(dep)} ${e.status==='confirmed'?'· paid':'· due'}</span></div>`;
  return `<header class="sh-head"><div><h2>${e.title}</h2><div class="sh-sub"><span>${ic('calendar',15)}${e.wd} ${e.day} Oct · ${e.time}</span><span>${ic('users',15)}${e.guests} guests</span><span>${ic('pin',15)}${e.area}</span></div></div><button class="x" data-action="close" aria-label="Close">${ic('x',18)}</button></header>
  <div class="sh-body">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill st-${e.status}">${EV_LABEL[e.status]}</span><span class="dtag ${e.diet}" style="position:static;background:var(--surface-2)"><i></i>${e.diet} menu</span></div>
    <div><div class="sh-h3">${e.pkg} · ${money(e.pp)} per guest</div><ul class="courses">${e.courses.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    <div class="sum"><div><span>${e.guests} guests × ${money(e.pp)}</span><span>${money(tot)}</span></div>${depRow}<div class="t"><span>${e.status==='inquiry'?'Quote':'Total'}</span><span>${money(tot)}</span></div></div>
    ${e.prep.length?`<div><div class="sh-h3">Prep · ${pg.d} of ${pg.n} done</div><div class="track" style="margin-bottom:6px"><i style="width:${pg.pct}%"></i></div>${prepList(e)}</div>`:''}
  </div>
  <footer class="sh-foot">${foot}</footer>`;
}
function sheetBell(){
  return `<header class="sh-head"><div><h2>Activity</h2><div class="sh-sub"><span>Latest from your kitchen and customers</span></div></div><button class="x" data-action="close" aria-label="Close">${ic('x',18)}</button></header>
  <div class="sh-body">${ACTIVITY.map(a=>`<div class="act"><div class="ai">${ic(a[0],18)}</div><div><b>${a[1]}</b><span>${a[2]}</span></div></div>`).join('')}</div>`;
}

/* ================= app ================= */
const NAV=[['today','Today','grid'],['orders','Orders','bag'],['menu','Menu','utensils'],['events','Catering','calendar']];
const VIEWS={today:todayView,orders:ordersView,menu:menuView,events:eventsView};

function mount(root,opts){
  const st={view:'today',kf:opts.kf,of:'all',q:'',mc:'All',sheet:null,anim:false};
  root.innerHTML=`<div class="shell">
    <aside class="side">
      <div class="brand"><div class="logo">${ic('utensils',19)}</div><div><b>Nora's Table</b><span>Home kitchen and catering</span></div></div>
      <nav class="snav" aria-label="Main">${NAV.map(n=>`<button class="sn" data-action="nav" data-id="${n[0]}">${ic(n[2],20)}<span>${n[1]}</span><em class="bdg"></em></button>`).join('')}</nav>
      <div class="foot"><div class="kc" data-slot="kc"></div><div class="me"><div class="av">N</div><div><b>Nora Kessler</b><span>Owner</span></div></div></div>
    </aside>
    <div class="col">
      <header class="mhead"><div class="mh-brand"><div class="logo sm">${ic('utensils',17)}</div>Nora's Table</div><div class="mh-right" data-slot="mh"></div></header>
      <div class="main" data-slot="main"><div class="view" data-slot="view"></div></div>
    </div>
    <nav class="tabbar" aria-label="Main">${NAV.map(n=>`<button class="tab" data-action="nav" data-id="${n[0]}"><span class="ti">${ic(n[2],22)}</span><span>${n[1]}</span><em class="bdg"></em></button>`).join('')}</nav>
  </div>
  <div class="scrim" data-slot="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" data-slot="sheet"><div class="grab"></div><div data-slot="sheetbody" style="display:flex;flex-direction:column;min-height:0;flex:1"></div></div></div>`;
  const q=s=>root.querySelector(`[data-slot="${s}"]`);
  const view=q('view'),main=q('main'),scrim=q('scrim'),sbody=q('sheetbody');

  function render(){
    const s=stats();
    view.innerHTML=VIEWS[st.view](st);
    if(st.anim){view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');st.anim=false}
    root.querySelectorAll('[data-action="nav"]').forEach(b=>{const on=b.dataset.id===st.view;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
    root.querySelectorAll('[data-id="orders"] .bdg').forEach(b=>{b.textContent=s.newN;b.classList.toggle('show',s.newN>0)});
    q('kc').innerHTML=`<div><b>${store.open?'Kitchen open':'Orders paused'}</b><span>${store.open?'Taking orders until 20:00':'Customers see a notice'}</span></div><button class="sw" role="switch" aria-checked="${store.open}" aria-label="Kitchen open" data-action="toggle-open"></button>`;
    q('mh').innerHTML=`${openChip()}<button class="icon-btn" data-action="bell" aria-label="Activity">${ic('bell',19)}<i class="ping"></i></button>`;
    renderSheet();
  }
  function renderSheet(){
    if(!st.sheet){scrim.hidden=true;return}
    const [k,id]=st.sheet;
    sbody.innerHTML=k==='order'?sheetOrder(id):k==='event'?sheetEvent(id):sheetBell();
    scrim.hidden=false;
  }
  function openSheet(k,id){st.sheet=[k,id];scrim.hidden=true;sbody.innerHTML='';renderSheet();
    // restart the entrance animation
    const sh=q('sheet');sh.style.animation='none';void sh.offsetWidth;sh.style.animation='';}
  function nav(v){st.view=v;st.sheet=null;st.anim=true;render();main.scrollTop=0}

  root.addEventListener('click',e=>{
    if(e.target===scrim){st.sheet=null;renderSheet();return}
    const t=e.target.closest('[data-action]');if(!t||!root.contains(t))return;
    const a=t.dataset.action,id=t.dataset.id;
    switch(a){
      case 'nav':nav(id);break;
      case 'kf':st.kf=id;render();break;
      case 'of':st.of=id;render();break;
      case 'mc':st.mc=id;render();break;
      case 'advance':e.stopPropagation();store.change(()=>{const o=store.orders.find(x=>x.id===id);if(NEXT[o.status])o.status=NEXT[o.status]});break;
      case 'open-order':openSheet('order',id);break;
      case 'open-event':openSheet('event',id);break;
      case 'bell':openSheet('bell');break;
      case 'close':st.sheet=null;renderSheet();break;
      case 'toggle-open':store.change(()=>{store.open=!store.open});break;
      case 'avail':store.change(()=>{const d=D[id];d.avail=!d.avail});break;
      case 'prep':store.change(()=>{const p=EV[id].prep[+t.dataset.i];p[1]=p[1]?0:1});break;
      case 'ev-advance':store.change(()=>{const ev=EV[id];ev.status=ev.status==='inquiry'?'deposit':'confirmed'});break;
    }
  });
  root.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&st.sheet){st.sheet=null;renderSheet();return}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();e.target.click()}
  });
  store.subs.push(render);
  render();
}

mount(document.getElementById('appD'),{kf:'all'});
mount(document.getElementById('appM'),{kf:'active'});

/* ================= page chrome: scaling + theme ================= */
const host=document.getElementById('host'),stage=document.getElementById('stage');
const slotD=document.getElementById('slotD'),slotM=document.getElementById('slotM');
function fit(){
  const w=host.clientWidth;
  if(window.innerWidth<=520)return;
  if(w>=1240){
    const s=Math.min(1,(w-48)/(1360+410));
    slotD.style.setProperty('--s',s);slotM.style.setProperty('--s',s);
    stage.classList.remove('stack');
  }else{
    slotD.style.setProperty('--s',Math.min(1,w/1360));
    slotM.style.setProperty('--s',Math.min(1,w/410));
    stage.classList.add('stack');
  }
}
new ResizeObserver(fit).observe(host);window.addEventListener('resize',fit);fit();

const root=document.documentElement,bL=document.getElementById('thLight'),bD=document.getElementById('thDark');
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintSeg(){const t=curTheme();bL.setAttribute('aria-pressed',t==='light');bD.setAttribute('aria-pressed',t==='dark')}
bL.addEventListener('click',()=>{root.dataset.theme='light';paintSeg()});
bD.addEventListener('click',()=>{root.dataset.theme='dark';paintSeg()});
paintSeg();
})();
